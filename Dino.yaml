## 🔧 How to Run
1. Connect the **16x2 LCD** and **buttons** as per the provided schematic.
2. Flash the compiled HEX file to your **ATmega2560** board.
3. Power on the system — the Dino starts running automatically.
4. Press the **jump button** to avoid obstacles and score points!

